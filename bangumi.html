            const LOCAL_COVERS_BY_NORM_TITLE = (() => {

            function normalizeStyles(styles) {
                if (!styles) return [];
                if (Array.isArray(styles)) return styles.filter(Boolean).map(String);
                if (typeof styles === 'string') {
                    return styles.split(',').map(s => s.trim()).filter(Boolean);
                }
                return [];
            }

            function toSlug(str) {
                const s = String(str || '').trim();
                if (!s) return '';
                const cleaned = s
                    .toLowerCase()
                    .replace(/\s+/g, '-')
                    .replace(/[^\w\u4e00-\u9fff-]/g, '')
                    .replace(/-+/g, '-');
                return cleaned.slice(0, 64);
            }

            function setImageCover(img, item) {
                const remote = item.cover || '';
                const local = item.title ? LOCAL_COVERS_BY_NORM_TITLE[normalizeTitleKey(item.title)] : '';

                const candidates = [];
                if (local) candidates.push(local);
                if (remote) candidates.push(remote);
                candidates.push(PLACEHOLDER);

                let i = 0;
                img.src = candidates[i] || PLACEHOLDER;
                img.addEventListener('error', function onError() {
                    i += 1;
                    img.removeEventListener('error', onError);
                    if (i < candidates.length) {
                        img.src = candidates[i];
                        img.addEventListener('error', onError, { once: false });
                    }
                });
            }

                });

                const info = document.createElement('div');
                info.className = 'info';

                const title = document.createElement('div');
                title.className = 'title';
                title.textContent = item.title || '';
                info.appendChild(title);

                if (item.evaluate) {
                    const desc = document.createElement('div');
                    desc.className = 'desc';
                    desc.textContent = item.evaluate;
                    info.appendChild(desc);
                }

                const meta = document.createElement('div');
                meta.className = 'meta';
                let hasMeta = false;

                if (item.latest_episode) {
                    const ep = document.createElement('div');
                    ep.className = 'episode';
                    ep.textContent = `📺 ${item.latest_episode}`;
                    meta.appendChild(ep);
                    hasMeta = true;
                }

                if (item.release_date) {
                    const rd = document.createElement('div');
                    rd.textContent = `📅 开播：${item.release_date}`;
                    meta.appendChild(rd);
                    hasMeta = true;
                }

                if (item.styles && item.styles.length > 0) {
                    meta.appendChild(buildTagSpans(item.styles));
                    hasMeta = true;
                }

                if (hasMeta) info.appendChild(meta);

                card.appendChild(info);
                return card;
            }

            function parseReleaseDate(str) {
                const s = String(str || '').trim();
                const m = s.match(/(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日/);
                if (!m) return null;
                const y = Number(m[1]);
                const mo = Number(m[2]);
                const d = Number(m[3]);
                if (!y || !mo || !d) return null;
                return Date.UTC(y, mo - 1, d);
            }

            function sortByReleaseDate(items) {
                const DESC = true;
                return items.slice().sort((a, b) => {
                    const ta = parseReleaseDate(a.release_date);
                    const tb = parseReleaseDate(b.release_date);

                    if (ta === null && tb === null) {
                        return (a.title || '').localeCompare(b.title || '', 'zh-Hans-CN');
                    }
                    if (ta === null) return 1;
                    if (tb === null) return -1;
                    return DESC ? (tb - ta) : (ta - tb);
                });
            }

            function renderPagination(totalItems, totalPages) {
                if (totalItems <= PAGE_SIZE || totalPages <= 1) {
                    paginationEl.style.display = 'none';
                    return;
                }

                paginationEl.style.display = 'flex';
                paginationEl.innerHTML = '';

                const prevBtn = document.createElement('button');
                prevBtn.type = 'button';
                prevBtn.className = 'btn';
                prevBtn.textContent = '上一页';
                prevBtn.disabled = state.page <= 1;
                prevBtn.addEventListener('click', () => {
                    state.page = Math.max(1, state.page - 1);
                    renderFromState();
                });

                const info = document.createElement('span');
                info.className = 'page-info';
                info.textContent = `第 ${state.page} / ${totalPages} 页 · 共 ${totalItems} 个`;

                const nextBtn = document.createElement('button');
                nextBtn.type = 'button';
                nextBtn.className = 'btn';
                nextBtn.textContent = '下一页';
                nextBtn.disabled = state.page >= totalPages;
                nextBtn.addEventListener('click', () => {
                    state.page = Math.min(totalPages, state.page + 1);
                    renderFromState();
                });

                paginationEl.appendChild(prevBtn);
                paginationEl.appendChild(info);
                paginationEl.appendChild(nextBtn);
            }

            function renderFromState() {
                const allItems = Array.isArray(state.filteredAll) ? state.filteredAll : [];
                const sorted = sortByReleaseDate(allItems);

                if (!sorted.length) {
                    state.page = 1;
                    paginationEl.style.display = 'none';
                    container.innerHTML = '';
                    const empty = document.createElement('div');
                    empty.className = 'grid-status';
                    empty.style.gridColumn = '1/-1';
                    empty.textContent = '✨ 没有匹配的番剧，试试清除筛选或换个关键词吧';
                    container.appendChild(empty);
                    return;
                }

                const totalPages = Math.ceil(sorted.length / PAGE_SIZE) || 1;
                if (state.page < 1) state.page = 1;
                if (state.page > totalPages) state.page = totalPages;

                const start = (state.page - 1) * PAGE_SIZE;
                const pageItems = sorted.slice(start, start + PAGE_SIZE);

                container.innerHTML = '';
                const frag = document.createDocumentFragment();
                pageItems.forEach((item) => frag.appendChild(buildCard(item)));
                container.appendChild(frag);

                renderPagination(sorted.length, totalPages);
            }

            function applyFilters(allItems) {
                const q = state.query.trim().toLowerCase();
                const selected = state.selectedStyles;

                return allItems.filter((item) => {
                    if (q) {
                        const title = (item.title || '').toLowerCase();
                        const evalText = (item.evaluate || '').toLowerCase();
                        if (!title.includes(q) && !evalText.includes(q)) return false;
                    }
                    if (selected.size > 0) {
                        const styles = item.styles || [];
                        let ok = false;
                        for (const s of styles) {
                            if (selected.has(s)) {
                                ok = true;
                                break;
                            }
                        }
                        if (!ok) return false;
                    }
                    return true;
                });
            }

            async function init() {
                const dataUrl = new URL('data/bangumi_data.json', document.baseURI).href;
                try {
                    const response = await fetch(dataUrl);
                    if (!response.ok) throw new Error('数据加载失败');
                    const raw = await response.json();

                    const allItems = Array.isArray(raw) ? raw : [];
                    const normalized = allItems.map((item, idx) => ({
                        __index: idx,
                        title: item.title || '',
                        cover: item.cover || '',
                        evaluate: item.evaluate || '',
                        latest_episode: item.latest_episode || '',
                        release_date: item.release_date || '',
                        styles: normalizeStyles(item.styles)
                    }));

                    const styleFreq = new Map();
                    normalized.forEach((it) => {
                        (it.styles || []).forEach((s) => {
                            if (!s) return;
                            styleFreq.set(s, (styleFreq.get(s) || 0) + 1);
                        });
                    });

                    const allStylesSorted = Array.from(styleFreq.entries())
                        .sort((a, b) => {
                            if (b[1] !== a[1]) return b[1] - a[1];
                            return a[0].localeCompare(b[0], 'zh-Hans-CN');
                        })
                        .map(([style]) => style);

                    const visibleTagCount = 10;
                    const visibleStyles = allStylesSorted.slice(0, visibleTagCount);
                    const hiddenStyles = allStylesSorted.slice(visibleTagCount);

                    function renderStyleChips() {
                        styleFiltersEl.innerHTML = '';

                        const stylesToRender = state.showAllStyleChips ? allStylesSorted : visibleStyles;

                        stylesToRender.forEach((style) => {
                            const active = state.selectedStyles.has(style);
                            const btn = document.createElement('button');
                            btn.type = 'button';
                            btn.className = 'style-chip';
                            btn.textContent = style;
                            btn.setAttribute('aria-pressed', active ? 'true' : 'false');
                            btn.classList.toggle('is-active', active);

                            btn.addEventListener('click', () => {
                                if (state.selectedStyles.has(style)) state.selectedStyles.delete(style);
                                else state.selectedStyles.add(style);

                                state.filteredAll = applyFilters(normalized);
                                state.page = 1;
                                renderStyleChips();
                                renderFromState();
                            });

                            styleFiltersEl.appendChild(btn);
                        });

                        if (hiddenStyles.length > 0) {
                            const moreBtn = document.createElement('button');
                            moreBtn.type = 'button';
                            moreBtn.className = 'btn';
                            if (state.showAllStyleChips) {
                                moreBtn.textContent = `收起（隐藏 ${hiddenStyles.length} 个）`;
                                moreBtn.addEventListener('click', () => {
                                    state.showAllStyleChips = false;
                                    renderStyleChips();
                                });
                            } else {
                                moreBtn.textContent = `更多标签（${hiddenStyles.length}）`;
                                moreBtn.addEventListener('click', () => {
                                    state.showAllStyleChips = true;
                                    renderStyleChips();
                                });
                            }
                            styleFiltersEl.appendChild(moreBtn);
                        }
                    }

                    function refreshListAndRender() {
                        state.filteredAll = applyFilters(normalized);
                        state.page = 1;
                        renderFromState();
                    }

                    renderStyleChips();
                    refreshListAndRender();

                    clearBtn.addEventListener('click', () => {
                        state.query = '';
                        state.selectedStyles.clear();
                        state.showAllStyleChips = false;
                        searchInput.value = '';

                        refreshListAndRender();
                        renderStyleChips();
                    });

                    searchInput.addEventListener('input', () => {
                        state.query = searchInput.value;
                        refreshListAndRender();
                    });
                } catch (err) {
                    console.error('加载失败:', err);
                    container.innerHTML = '<div class="grid-status" style="grid-column: 1/-1; color: #e74c3c;">❌ 数据加载失败，请确保 bangumi_data.json 文件存在且格式正确</div>';
                }
            }

            init();
        })();
    </script>
</body>
</html>
